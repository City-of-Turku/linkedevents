name: Linkedevents tests

on:
  push:
    branches:
      - production
      - development
      - feature/github-action-tests
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: [ ubuntu-18.04 ]
    services:
      postgres:
        image: postgis/postgis:12
        env:
          POSTGRES_USER: linkedevents
          POSTGRES_PASSWORD: linkedevents
          POSTGRES_DB: linkedevents
          SECRET_KEY: linkedevents_secret
          DEBUG: true
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      matrix:
        python-version: ["3.7"]
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Ubuntu packages
        run: |
          sudo apt-get install python-dev libpq-dev gdal-bin -y
      - name: Install requirements
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Apply migrations
        env:
          DATABASE_URL: postgis://linkedevents:linkedevents@localhost/linkedevents
          DEBUG: true
          SECRET_KEY: linkedevents_secret
        run: |
          python3 manage.py migrate
      - name: Compile translations
        run: |
          python3 manage.py compilemessages
      - name: Run tests
        env:
          DATABASE_URL: postgis://linkedevents:linkedevents@localhost/linkedevents
          DEBUG: true
          SECRET_KEY: linkedevents_secret
        run: |
          pytest