definitions:
  User:
    required:
      - username
      - uuid
    type: object
    properties:
      last_login:
        title: Viimeisin kirjautuminen
        type: string
        format: date-time
        x-nullable: true
      username:
        title: Käyttäjätunnus
        description: Vaaditaan. Enintään 150 merkkiä. Vain kirjaimet, numerot ja @/./+/-/_
          ovat sallittuja.
        type: string
        pattern: ^[\w.@+-]+$
        maxLength: 150
        minLength: 1
      email:
        title: Sähköpostiosoite
        type: string
        format: email
        maxLength: 254
      date_joined:
        title: Liittynyt
        type: string
        format: date-time
      first_name:
        title: Etunimi
        type: string
        maxLength: 30
      last_name:
        title: Sukunimi
        type: string
        maxLength: 150
      uuid:
        title: Uuid
        type: string
        format: uuid
      department_name:
        title: Department name
        type: string
        maxLength: 50
        x-nullable: true
      is_staff:
        title: Ylläpitäjä
        description: Määrittää, pääseekö käyttäjä tähän sivuston ylläpito-osioon.
        type: boolean
      is_superuser:
        title: Pääkäyttäjä
        description: Määrittää, onko käyttäjällä pääkäyttäjän oikeudet.
        type: boolean
      display_name:
        title: Display name
        type: string
        readOnly: true
